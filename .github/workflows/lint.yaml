name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'

      - name: Install dev dependencies
        run: yarn install

      - name: ESLint
        run: yarn run eslint
